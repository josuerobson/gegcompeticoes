<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="G&G Competições - Plataforma oficial de gestão de campeonatos, resultados e ranking de tiro esportivo." />
    <title>G&G Competições - Estande e Tiro Esportivo</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="G&G Competições" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Capture `beforeinstallprompt` as early as possible, before the React app
      (and its sequential API data sync) finishes mounting — the event fires
      once per page load and is lost forever if nothing is listening yet.
      InstallPwaPrompt.tsx reads window.__pwaInstallEvent on mount instead of
      listening for the native event directly.
    -->
    <script>
      window.__pwaInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallEvent = e;
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
